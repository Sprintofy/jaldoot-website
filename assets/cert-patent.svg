<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-label="Indian patent certificate for the four-stage water conditioning apparatus invented by Krushi Nature Water Care">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DB74A"/>
      <stop offset="0.5" stop-color="#00ADEE"/>
      <stop offset="1" stop-color="#134FA1"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2FBF2"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="sealFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ADEE"/>
      <stop offset="1" stop-color="#4DB74A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1000" fill="#FFFFFF"/>
  <rect x="26" y="26" width="1148" height="948" fill="url(#wash)"/>
  <rect x="26" y="26" width="1148" height="948" fill="none" stroke="url(#frame)" stroke-width="10"/>
  <rect x="50" y="50" width="1100" height="900" fill="none" stroke="#4DB74A" stroke-width="1.5" opacity="0.45"/>
  <rect x="62" y="62" width="1076" height="876" fill="none" stroke="#00ADEE" stroke-width="1" opacity="0.35"/>

  <g opacity="0.07" transform="rotate(-28 600 500)">
    <text x="600" y="540" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="150" font-weight="700" fill="#4DB74A" text-anchor="middle" letter-spacing="10">SPECIMEN</text>
  </g>

  <g transform="translate(600 158)">
    <circle r="44" fill="url(#frame)"/>
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.94">
      <path d="M-24 6c6-11 15-11 21 0"/>
      <path d="M-11 -3c6-11 15-11 21 0"/>
      <path d="M2 -12c6-11 15-11 21 0"/>
    </g>
    <text y="35" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">JALDOOT</text>
  </g>

  <text x="600" y="262" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#6D6E6F" text-anchor="middle" letter-spacing="7">KRUSHI NATURE WATER CARE PVT. LTD.</text>

  <text x="600" y="342" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" fill="#134FA1" text-anchor="middle" letter-spacing="2">PATENT CERTIFICATE</text>

  <rect x="480" y="368" width="240" height="5" fill="url(#frame)"/>

  <text x="600" y="436" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" fill="#6D6E6F" text-anchor="middle">Granted to the applicant for the invention titled</text>
  <text x="600" y="482" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#0A1628" text-anchor="middle">Four-Stage Water Conditioning Apparatus</text>
  <text x="600" y="520" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" fill="#6D6E6F" text-anchor="middle">Indian Patent &#8212; Intellectual Property Office</text>

  <rect x="310" y="560" width="580" height="108" rx="14" fill="#4DB74A" opacity="0.07"/>
  <rect x="310" y="560" width="580" height="108" rx="14" fill="none" stroke="#4DB74A" stroke-width="1.5" opacity="0.4"/>
  <text x="600" y="604" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" fill="#134FA1" text-anchor="middle" letter-spacing="1">PATENT GRANTED</text>
  <text x="600" y="638" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#6D6E6F" text-anchor="middle">Indian Patent &#8212; Four-stage water conditioning method</text>

  <text x="600" y="712" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#6D6E6F" text-anchor="middle">Scope: Ultrasonic, magnetic, pulsing and catalytic treatment stages</text>
  <text x="600" y="742" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#6D6E6F" text-anchor="middle">Patent No. IN-2024-0412567 &#160;&#8226;&#160; Valid until 31 December 2044</text>

  <g transform="translate(250 812)">
    <path d="M0 0c42-15 84-15 126 0" fill="none" stroke="#134FA1" stroke-width="2"/>
    <text x="63" y="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#134FA1" text-anchor="middle">Patent Attorney</text>
  </g>

  <g transform="translate(950 838)">
    <circle r="54" fill="url(#sealFill)"/>
    <circle r="43" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
    <text y="-14" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PATENTED</text>
    <text y="12" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">IP</text>
    <text y="32" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" opacity="0.9">SPECIMEN</text>
  </g>
</svg>