  - generic [ref=f22e242]:
    - generic [ref=f22e243]:
      - generic [ref=f22e244]:
        - generic [ref=f22e245]: 
        - text: Our Technology
      - heading "Jaldoot Technology" [level=2] [ref=f22e246]
      - paragraph [ref=f22e247]: Four powerful technologies combined in one microprocessor-controlled system for comprehensive water conditioning.
    - generic [ref=f22e248]:
      - article [ref=f22e249]:
        - generic [aria-hidden] [ref=f22e250]: "01"
        - generic [ref=f22e253]:
          - generic [ref=f22e254]:
            - generic [ref=f22e255]: 
            - generic [ref=f22e257]:
              - heading "Ultrasonic" [level=3] [ref=f22e258]
              - paragraph [ref=f22e259]: High-frequency wave technology
          - paragraph [ref=f22e260]: Ultrasonic waves break down hard water mineral bonds at a molecular level. This first line of treatment initiates the conversion process, disrupting calcium and magnesium compound structures to begin transformation into harmless particles.
          - generic [ref=f22e261]:
            - generic [ref=f22e262]: 
            - text: Stage 1 Treatment
      - article [ref=f22e263]:
        - generic [aria-hidden] [ref=f22e264]: "02"
        - generic [ref=f22e267]:
          - generic [ref=f22e268]:
            - generic [ref=f22e269]: 
            - generic [ref=f22e271]:
              - heading "Magnetic Static" [level=3] [ref=f22e272]
              - paragraph [ref=f22e273]: Permanent magnetic field
          - paragraph [ref=f22e274]: A permanent magnetic field alters the crystalline structure of calcium carbonate from its hard, scale-forming calcite form into a softer aragonite form that does not adhere to pipe surfaces and equipment.
          - generic [ref=f22e275]:
            - generic [ref=f22e276]: 
            - text: Stage 2 Treatment
      - article [ref=f22e277]:
        - generic [aria-hidden] [ref=f22e278]: "03"
        - generic [ref=f22e281]:
          - generic [ref=f22e282]:
            - generic [ref=f22e283]: 
            - generic [ref=f22e285]:
              - heading "Pulsing Power" [level=3] [ref=f22e286]
              - paragraph [ref=f22e287]: Variable frequency signals
          - paragraph [ref=f22e288]: The microprocessor generates variable-frequency electronic pulses through coil cables. These signals create an oscillating electromagnetic field preventing mineral crystallization and scale formation throughout the pipe system.
          - generic [ref=f22e289]:
            - generic [ref=f22e290]: 
            - text: Stage 3 Treatment
      - article [ref=f22e291]:
        - generic [aria-hidden] [ref=f22e292]: "04"
        - generic [ref=f22e295]:
          - generic [ref=f22e296]:
            - generic [ref=f22e297]: 
            - generic [ref=f22e299]:
              - heading "Catalytic Technology" [level=3] [ref=f22e300]
              - paragraph [ref=f22e301]: Crystal conversion process
          - paragraph [ref=f22e302]: Catalytic conversion transforms remaining hardness minerals into stable, harmless micro-crystals of 2–4 micron size. These crystals remain suspended in water and flow freely. The conditioning effect lasts up to 7 days.
          - generic [ref=f22e303]:
            - generic [ref=f22e304]: 
            - text: Stage 4 Treatment
    - generic [ref=f22e309]:
      - generic [ref=f22e310]: 
      - generic [ref=f22e312]:
        - heading "Microprocessor-Controlled System" [level=3] [ref=f22e313]
        - paragraph [ref=f22e314]: The entire Jaldoot system is controlled by an advanced microprocessor that automatically manages and optimizes all four technologies — Ultrasonic, Magnetic Static, Pulsing Power and Catalytic — ensuring consistent, reliable performance across all water conditions and flow rates.
