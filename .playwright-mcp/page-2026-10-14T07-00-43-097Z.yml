        - paragraph [ref=f22e68]:
          - text: Krushi Nature Water Care Pvt. Ltd. is an
          - strong [ref=f22e69]: ISO 9001:2008 certified
          - text: company engaged in the manufacturing and supply of advanced water conditioning solutions. The company specializes in
