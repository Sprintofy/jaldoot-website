      - heading "Process of the Jaldoot Water Conditioner" [level=2] [ref=f2e255]
      - generic [ref=f2e256]:
        - generic [aria-hidden] [ref=f2e257]: 
        - text: 3-Stage — Electrolysis, Electronic Frequency with Permanent Magnet, Electromagnetic
    - generic [ref=f2e258]:
      - article [ref=f2e261]:
        - generic [ref=f2e262]:
          - generic [ref=f2e263]: "1"
          - generic [aria-hidden] [ref=f2e265]: 
          - heading "Electrolysis" [level=3] [ref=f2e266]
          - paragraph [ref=f2e267]: The process of induced ionization is taken to its ultimate stage of cathode and anode, breaking down hard water mineral bonds and initiating the transformation of scale-causing minerals.
          - generic [ref=f2e277]:
            - generic [aria-hidden] [ref=f2e278]: 
            - text: Stage 1
      - article [ref=f2e279]:
        - generic [ref=f2e280]:
          - generic [ref=f2e281]: "2"
          - generic [aria-hidden] [ref=f2e283]: 
          - heading "Electronic Frequency with Permanent Magnet" [level=3] [ref=f2e284]
          - paragraph [ref=f2e285]: A frequency modulated (FM) waveform within the audio frequency (AF) bandwidth, combined with a permanent magnet. It alters the crystalline structure of hard water minerals, converting them into microscopic 2–4 micron crystals.
          - generic [ref=f2e292]:
            - generic [aria-hidden] [ref=f2e293]: 
            - text: Stage 2
      - article [ref=f2e294]:
        - generic [ref=f2e295]:
          - generic [ref=f2e296]: "3"
          - generic [aria-hidden] [ref=f2e298]: 
          - heading "Electromagnetic" [level=3] [ref=f2e299]
          - paragraph [ref=f2e300]: The principles of magneto hydrodynamics (MHD) applied through a patented signal passed through a coil wrapped around the pipe to be treated, ensuring complete conditioning of the water.
          - generic [ref=f2e311]:
            - generic [aria-hidden] [ref=f2e312]: 
            - text: Stage 3
