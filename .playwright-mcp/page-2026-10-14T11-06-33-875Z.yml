            - generic [ref=f2e374]: Days
          - heading "The longer lasting effect" [level=3] [ref=f2e375]
          - paragraph [ref=f2e376]:
            - text: It has been established that the physiochemical process already described is more efficient because the signal energy is
            - strong [ref=f2e377]: dynamically changing
            - text: . By changing the signal field at high audio frequencies, unique to Jaldoot, the energy imparted to the nuclei is considerably accelerated.
          - paragraph [ref=f2e378]:
            - text: An important property of Jaldoot processed water is that the charged crystalline shape growth will remain in that state for
            - strong [ref=f2e379]: up to 7 days
            - text: . Thus in stored water systems the effect is much longer lasting than other ionization methods, retarding the reversion back to the smaller nuclei structures that are readily precipitated.
