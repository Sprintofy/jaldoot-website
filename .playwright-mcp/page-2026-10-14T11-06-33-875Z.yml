          - text: Problems caused by hard water
        - heading "Calcite — the main cause of scale" [level=2] [ref=f2e134]
        - generic [ref=f2e136]:
          - paragraph [ref=f2e137]: Calcite, the main cause of scale, is the most common form of calcium carbonate and occurs naturally as an ingredient of chalk, limestone and marble. Water passing over and permeating through such rocks dissolves calcite; when this water subsequently flows through a water system the calcite precipitates out to form a very hard scale on surfaces.
          - paragraph [ref=f2e138]: When hard water is heated, or evaporation takes place, the problems are exacerbated. Calcite forms ever growing layers of rock-like deposits until eventually pipes, jets and equipment become totally blocked. The problem increases as the water gets hotter.
      - generic [ref=f2e140]:
        - generic [ref=f2e141]:
          - generic [ref=f2e143]: 
          - heading "Why it matters" [level=3] [ref=f2e144]
        - list [ref=f2e145]:
          - listitem [ref=f2e146]:
            - generic [ref=f2e148]: 
            - paragraph [ref=f2e149]: Scale builds up inside pipes and fittings, shrinking the bore over time.
          - listitem [ref=f2e150]:
            - generic [ref=f2e152]: 
            - paragraph [ref=f2e153]: The thicker the scale, the harder the system works and the more fuel it burns.
          - listitem [ref=f2e154]:
            - generic [ref=f2e156]: 
            - paragraph [ref=f2e157]: Hotter water accelerates scale growth, so heating is where the damage starts.
          - listitem [ref=f2e158]:
            - generic [ref=f2e160]: 
            - paragraph [ref=f2e161]: Once removed, scale keeps returning unless the water itself is treated.
    - generic [ref=f2e162]:
      - generic [ref=f2e164]:
        - heading "What it costs you" [level=3] [ref=f2e165]
        - paragraph [ref=f2e166]: Scale is rarely one big failure. It is a steady drain on efficiency, running costs and equipment life.
      - generic [ref=f2e167]:
        - article [ref=f2e168]:
          - generic [aria-hidden]: "01"
          - heading "Wasted energy & money" [level=3] [ref=f2e177]
          - paragraph [ref=f2e178]: Just one eighth of an inch of scale reduces heating efficiency by 25%.
          - generic [ref=f2e179]: 25% efficiency lost
        - article [ref=f2e180]:
          - generic [aria-hidden]: "02"
          - heading "Expensive de-scaling" [level=3] [ref=f2e188]
          - paragraph [ref=f2e189]: It is very expensive to remove scale from pipes and boilers.
          - generic [ref=f2e190]: High removal cost
        - article [ref=f2e191]:
          - generic [aria-hidden]: "03"
          - heading "Costly down-time" [level=3] [ref=f2e199]
          - paragraph [ref=f2e200]: Higher warranty costs, costly down-time and higher cleaning agent costs.
          - generic [ref=f2e201]: Production stops
        - article [ref=f2e202]:
          - generic [aria-hidden]: "04"
          - heading "Blocked showers & plumbing" [level=3] [ref=f2e216]
          - paragraph [ref=f2e217]: Shower and plumbing blockages, reduced efficiency and higher energy costs.
          - generic [ref=f2e218]: Higher energy bills
        - article [ref=f2e219]:
          - generic [aria-hidden]: "05"
          - heading "Premature failure" [level=3] [ref=f2e232]
          - paragraph [ref=f2e233]: Premature & unexpected failure, higher maintenance and more time spent cleaning.
          - generic [ref=f2e234]: Shorter equipment life
        - article [ref=f2e235]:
          - generic [aria-hidden]: "06"
          - heading "More soap & detergent" [level=3] [ref=f2e246]
          - paragraph [ref=f2e247]: Hard water wastes soap, detergent and shampoo, raising everyday running costs.
