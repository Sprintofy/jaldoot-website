      - heading "Changed size, modified charge, new crystal shape" [level=2] [ref=f2e324]
      - paragraph [ref=f2e325]: Rock-hard calcite is not removed by force — it is broken down at particle level, so it can never build up again.
    - generic [ref=f2e326]:
      - generic [ref=f2e327]:
        - generic [ref=f2e352]:
          - generic [ref=f2e353]: Untreated calcite
          - generic [ref=f2e354]: Signal field
          - generic [ref=f2e355]: 2–4 micron crystals
        - generic [ref=f2e356]:
          - paragraph [ref=f2e357]:
            - text: It is this changed size, modified charge and crystalline shape that has the first two beneficial properties for the reduction of scale. The
            - strong [ref=f2e358]: 2–4 micron sized crystals become non-sticky
            - text: and will not coagulate or precipitate and form scale in the same way as untreated calcium carbonate nuclei would.
          - paragraph [ref=f2e359]:
            - text: This process is so effective that the water has been found to
            - strong [ref=f2e360]: feel and behave like chemically softened water
            - text: . The presence of the large crystalline shapes disrupts the equilibrium between the fluid and any existing scale. Smaller particles in general dissolve more easily, so the larger particles will have reduced the levels of calcite in solution.
          - paragraph [ref=f2e361]:
            - text: Hence, existing scale deposited by precipitation will
            - strong [ref=f2e362]: soften and gradually be absorbed into solution
            - text: and flow out of the system. In areas of still water, e.g. tanks etc., the soft scale would settle to the bottom and could then be removed simply by flushing.
      - generic [ref=f2e363]:
